name: Update GitHub Activity

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const user = "Gowangz";
            const start = "<!--START_SECTION:activity-->";
            const end = "<!--END_SECTION:activity-->";
            const events = (await github.rest.activity.listPublicEventsForUser({ username: user, per_page: 5 })).data;
            const labels = {
              PushEvent: "Pushed commits",
              CreateEvent: "Created new content",
              IssuesEvent: "Updated an issue",
              IssueCommentEvent: "Commented on an issue",
              PullRequestEvent: "Updated a pull request",
              PullRequestReviewEvent: "Reviewed a pull request",
              WatchEvent: "Starred a repository",
              ForkEvent: "Forked a repository",
              ReleaseEvent: "Published a release"
            };
            const formatDate = value => new Date(value).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" });
            const lines = events.length
              ? events.map(event => `- **${labels[event.type] || event.type.replace("Event", "")}** in [${event.repo.name}](https://github.com/${event.repo.name}) · ${formatDate(event.created_at)}`).join("\n")
              : "- Building quietly — new automation experiments will appear here soon.";
            const file = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path: "README.md" });
            const text = Buffer.from(file.data.content, "base64").toString();
            const a = text.indexOf(start);
            const b = text.indexOf(end);
            if (a < 0 || b < 0) core.setFailed("Activity markers not found");
            else {
              const updated = text.slice(0, a) + start + "\n" + lines + "\n" + end + text.slice(b + end.length);
              if (updated !== text) {
                await github.rest.repos.createOrUpdateFileContents({ owner: context.repo.owner, repo: context.repo.repo, path: "README.md", message: "chore: update recent GitHub activity", content: Buffer.from(updated).toString("base64"), sha: file.data.sha, branch: context.payload.repository.default_branch });
              }
            }
